<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novos Lançamentos em Breve</title>
  <style>
    :root {
      --bg-color: #050505;
      --accent-color: #00ffcc; /* Verde neon criativo */
      --text-main: #ffffff;
      --text-muted: #888888;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      padding: 2rem;
    }

    /* Fundo sutil com efeito de brilho */
    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: var(--accent-color);
      border-radius: 50%;
      filter: blur(150px);
      opacity: 0.15;
      z-index: 0;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    main {
      text-align: center;
      z-index: 1;
      max-width: 600px;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 0.5rem 1rem;
      border-radius: 50px;
      margin-bottom: 2rem;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
    }

    h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      letter-spacing: -1px;
    }

    p.description {
      color: var(--text-muted);
      font-size: clamp(1rem, 1.5vw, 1.2rem);
      margin-bottom: 3rem;
    }

    /* Formulário de captura */
    .notify-form {
      display: flex;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.03);
      padding: 0.5rem;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 450px;
      margin: 0 auto;
      transition: border-color 0.3s;
    }

    .notify-form:focus-within {
      border-color: var(--accent-color);
    }

    .notify-form input[type="email"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      padding: 0 1.5rem;
      font-size: 1rem;
    }

    .notify-form input[type="email"]::placeholder {
      color: #555;
    }

    .notify-form button {
      background: var(--accent-color);
      color: #000;
      border: none;
      font-weight: bold;
      padding: 0.8rem 1.5rem;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .notify-form button:hover {
      transform: scale(1.03);
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
    }

    footer {
      position: absolute;
      bottom: 2rem;
      color: #333;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <main>
    <div class="badge">Aguarde</div>
    <h1>Lançamentos por aqui em breve.</h1>
    <p class="description">Em breve completamente novo e fora de série. Deixe seu e-mail para ser o primeiro a saber quando estiver no ar.</p>
    
    <form class="notify-form" onsubmit="event.preventDefault(); alert('E-mail cadastrado com sucesso!');">
      <input type="email" placeholder="Deixe seu e-mail..." required>
      <button type="submit">Me Avise</button>
    </form>
  </main>

  <footer>
    &copy; 2026 Liam7Coder. Todos os direitos reservados.
  </footer>

</body>
</html>
